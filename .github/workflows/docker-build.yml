name: Build and Push Multi-Arch Image to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 准备镜像名称（改为 fakehttp-fakesip）
      - name: Prepare Image Name
        id: prep
        run: |
          # 使用固定的镜像名，不依赖仓库名（仓库名可以保持原样，但镜像名改为 fakehttp-fakesip）
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/fakehttp-fakesip"
          # 转小写
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}:${{ github.event.inputs.version }}
            ${{ steps.prep.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. 保存镜像为 tar 包（文件名改为 fakehttp-fakesip）
      - name: Save Docker Image to Tar (AMD64)
        run: |
          docker pull ${{ steps.prep.outputs.image_name }}:latest --platform linux/amd64
          docker save ${{ steps.prep.outputs.image_name }}:latest | gzip > fakehttp-fakesip_amd64.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: fakehttp-fakesip_amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
