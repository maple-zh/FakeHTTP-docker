name: Build and Push Multi-Arch Image to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker 镜像版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      fakehttp_version:
        description: 'FakeHTTP 版本 (例如 0.9.18)'
        required: false
        default: '0.9.18'
      fakesip_version:
        description: 'FakeSIP 版本 (例如 0.9.1)'
        required: false
        default: '0.9.1'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Image Name
        id: prep
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/fakehttp-fakesip"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}:${{ github.event.inputs.version }}
            ${{ steps.prep.outputs.image_name }}:latest
          build-args: |
            FAKEHTTP_VERSION=${{ github.event.inputs.fakehttp_version }}
            FAKESIP_VERSION=${{ github.event.inputs.fakesip_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker Image (AMD64)
        run: |
          docker pull ${{ steps.prep.outputs.image_name }}:${{ github.event.inputs.version }} --platform linux/amd64
          docker save ${{ steps.prep.outputs.image_name }}:${{ github.event.inputs.version }} | gzip > fakehttp-fakesip_amd64.tar.gz

      - name: Save Docker Image (ARM64)
        run: |
          docker pull ${{ steps.prep.outputs.image_name }}:${{ github.event.inputs.version }} --platform linux/arm64
          docker save ${{ steps.prep.outputs.image_name }}:${{ github.event.inputs.version }} | gzip > fakehttp-fakesip_arm64.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            fakehttp-fakesip_amd64.tar.gz
            fakehttp-fakesip_arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
